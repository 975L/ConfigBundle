name: CI

on:
    push:
        branches: [main, dev]
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest

        # Au niveau du job et non de l'étape : le contexte `env` d'une étape ne contient pas son propre bloc `env:`
        env:
            CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

            # Composer versionne le paquet racine d'après la branche, jamais d'après le tag : `dev-dev` ne satisfait pas le `c975l/config-bundle: ^5` d'UiBundle, qui redescend alors sur une version antérieure
            COMPOSER_ROOT_VERSION: 5.x-dev

        steps:
            - uses: actions/checkout@v5

            # pcov mesure la couverture, que la machine de développement n'a pas ; les outils qualité sont installés ici plutôt qu'en require-dev, pour ne pas alourdir le bundle de 17 paquets transitifs
            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.4'
                  coverage: pcov
                  tools: phpcs, phpstan, php-cs-fixer

            # update et non install : le composer.lock n'est pas versionné, et les bundles pointent les uns vers les autres
            - name: Dépendances
              run: composer update --no-interaction --no-progress

            - name: PSR-12
              run: phpcs -q

            # --diff pour lire directement dans les logs ce qui s'écarte du standard, plutôt que la seule liste des fichiers
            - name: Standard Symfony
              run: php-cs-fixer check --diff

            - name: Analyse statique
              run: phpstan analyse --no-progress

            # Seconde passe en level 6 sur le seul scaffold : il est recopié tel quel dans les applications, qui l'analysent à ce niveau-là
            - name: Analyse statique du scaffold
              run: phpstan analyse -c phpstan-scaffold.dist.neon --no-progress

            - name: Tests
              run: vendor/bin/phpunit --coverage-clover clover.xml

            # Sans le secret, l'envoi est sauté plutôt que de faire échouer la CI
            - name: Couverture vers Codacy
              if: env.CODACY_PROJECT_TOKEN != ''
              uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
              with:
                  project-token: ${{ env.CODACY_PROJECT_TOKEN }}
                  coverage-reports: clover.xml
