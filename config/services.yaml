services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true

    c975L\ConfigBundle\:
        resource: '../src/'
        exclude: '../src/{DependencyInjection,Entity}'

    c975L\ConfigBundle\Management\MenuBuilder:
        arguments:
            $menuProviders: !tagged_iterator c975l.management_menu_provider

    c975L\ConfigBundle\Management\WhatsNewBuilder:
        arguments:
            $whatsNewProviders: !tagged_iterator c975l.whatsnew_provider

    c975L\ConfigBundle\Management\AlertBuilder:
        arguments:
            $alertProviders: !tagged_iterator c975l.alert_provider

    c975L\ConfigBundle\Management\ShortcutBuilder:
        arguments:
            $shortcutProviders: !tagged_iterator c975l.shortcut_provider

    c975L\ConfigBundle\Management\SitemapWriter:
        arguments:
            $sitemapProviders: !tagged_iterator c975l.sitemap_provider

    c975L\ConfigBundle\Management\ImportDispatcher:
        arguments:
            $importProviders: !tagged_iterator c975l.import_provider

    c975L\ConfigBundle\Service\Export\SyncAllExporter:
        arguments:
            $exportProviders: !tagged_iterator c975l.export_provider

    c975L\ConfigBundle\Management\ProcedureBuilder:
        arguments:
            $procedureProviders: !tagged_iterator c975l.procedure_provider

    c975L\ConfigBundle\Management\LinkableRouteRegistry:
        arguments:
            $providers: !tagged_iterator c975l.linkable_route_provider

    c975L\ConfigBundle\Management\EssentialActionBuilder:
        arguments:
            $essentialActionProviders: !tagged_iterator c975l.essential_action_provider

    c975L\ConfigBundle\Management\DashboardWidgetBuilder:
        arguments:
            $dashboardWidgetProviders: !tagged_iterator c975l.dashboard_widget_provider

    c975L\ConfigBundle\Management\HealthCheckRunner:
        arguments:
            $healthCheckProviders: !tagged_iterator c975l.health_check_provider

    c975L\ConfigBundle\Management\HealthCheckAdviceBuilder:
        arguments:
            $healthCheckAdviceProviders: !tagged_iterator c975l.health_check_advice_provider

    c975L\ConfigBundle\Management\ImportmapRegistry:
        arguments:
            $providers: !tagged_iterator c975l.importmap_provider

    c975L\ConfigBundle\Controller\Management\DashboardController:
        tags: ['controller.service_arguments']

    c975L\ConfigBundle\Service\StylesheetProvider:
        tags:
            - { name: 'ui.management_stylesheet' }

    c975L\ConfigBundle\Service\ScriptProvider:
        tags:
            - { name: 'ui.admin_script' }

# Wiring for c975l:dev-profile:run, kept under when@dev on purpose: its classes are all marked #[When('dev')], and an entry in the block above would put them back in every environment, prod included, where the "profiler" service doesn't exist. _defaults has to be repeated, a when@ block being parsed as its own root
when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
            public: true

        c975L\ConfigBundle\Management\DevProfileRunner:
            arguments:
                $devProfilePathProviders: !tagged_iterator c975l.dev_profile_path_provider

        c975L\ConfigBundle\Management\DevProfileCollector:
            arguments:
                # Neither has an autowiring alias. "@?profiler" rather than "@profiler": a dev environment set up without symfony/profiler-pack must get the command's own message, not a container that won't compile
                $profiler: '@?profiler'
                $servicesResetter: '@services_resetter'

